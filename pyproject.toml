[project]
name = "quantum-project"
version = "0.1.0"
description = "QML Chemical Discovery Engine - motore fisico OOP, traduttore ML/QML e oracolo ibrido VQE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "psycopg2-binary>=2.9.12",
    "pyscf>=2.14.0",
    "python-dotenv>=1.2.2",
    "qiskit>=2.5.0",
    "qiskit-algorithms>=0.4.0",
    "qiskit-nature>=0.8.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: test che richiedono un database PostgreSQL raggiungibile",
]
